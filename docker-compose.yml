version: '3.9'

networks:
  rpg-internal:
    internal: true
  traefik-public:
    external: true

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    networks:
      - rpg-internal
    environment:
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_SERVER_URL=${CLIENT_ORIGIN}
    networks:
      - rpg-internal
      - traefik-public
    depends_on:
      - server
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rpg.rule=Host(`rpg.oudinallan.dev`)"
      - "traefik.http.routers.rpg.entrypoints=websecure"
      - "traefik.http.routers.rpg.tls.certresolver=letsencrypt"
      - "traefik.http.services.rpg-client.loadbalancer.server.port=5173"
      - "traefik.http.routers.rpg.service=rpg-client"
      - "traefik.http.routers.rpg-socket.rule=Host(`rpg.oudinallan.dev`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.rpg-socket.entrypoints=websecure"
      - "traefik.http.routers.rpg-socket.tls.certresolver=letsencrypt"
      - "traefik.http.services.rpg-socket.loadbalancer.server.port=3000"
      - "traefik.http.routers.rpg-socket.service=rpg-socket"
      - "traefik.http.routers.rpg-socket.priority=10"
      - "traefik.http.routers.rpg.priority=1"
